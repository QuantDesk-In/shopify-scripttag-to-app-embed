# Only the parts that matter for this migration. Merge into your own file.

[access_scopes]
# read_themes: read config/settings_data.json and receive themes/publish.
# write_script_tags: delete script tags (it also grants read).
scopes = "read_themes,write_script_tags"

[webhooks]
api_version = "2026-10"

  # A relative uri is resolved against application_url. Set that to your app's own URL
  # first; deploy rejects the subscription while it is still the CLI default.
  [[webhooks.subscriptions]]
  topics = ["themes/publish"]
  uri = "/webhooks/themes/publish"
